# ==============================================================================
#  gradle-daemon-jvm.properties: which Java version the Gradle daemon runs on
# ==============================================================================
#
#  Gradle reads this file natively (the "daemon JVM criteria" feature). It
#  states a Java *version*, not a path, so it works unchanged on Windows, macOS,
#  Linux and CI, and it is safe to commit.
#
#  How it works: you start ./gradlew with whatever Java is on PATH/JAVA_HOME
#  (any version Gradle itself supports). The launcher then looks for an
#  installed JDK 25 and starts the build daemon on it. That matters because
#  Minecraft 26.x and this build (options.release = 25 in build.gradle) need
#  Java 25.
#
#  JDK auto-detection checks the usual install locations: the Windows registry,
#  /Library/Java/JavaVirtualMachines on macOS, /usr/lib/jvm on Linux, SDKMAN,
#  asdf, IntelliJ-downloaded JDKs, and the JVM that launched Gradle. If your
#  JDK 25 lives somewhere unusual, tell Gradle in your per-machine
#  ~/.gradle/gradle.properties (NOT in this repo):
#      org.gradle.java.installations.paths=/path/to/jdk-25
#
#  If no JDK 25 is found, the build stops with an error that says so.
#
#  Keep this in sync with options.release in build.gradle and "java" in
#  fabric.mod.json.
# ==============================================================================
toolchainVersion=25

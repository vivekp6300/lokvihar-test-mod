# ==============================================================================
#  gradle.properties: the single source of truth for versions and build flags
# ==============================================================================
#
#  Every `key=value` here becomes:
#    - a Gradle setting, for keys starting with "org.gradle."
#    - a project property otherwise, readable in build.gradle as
#      ${project.key} or just "${key}"
#
#  UPGRADING MINECRAFT? Change minecraft_version, loader_version, loom_version
#  and fabric_api_version together, using the values that
#  https://fabricmc.net/develop shows for the target version. Then update the
#  "depends" block in src/main/resources/fabric.mod.json to match.
#
#  Note: this file format has no trailing comments. A "#" must start the line.
# ==============================================================================


# ------------------------------------------------------------------------------
#  Gradle daemon / performance
# ------------------------------------------------------------------------------

# Done to increase the memory available to gradle.
# Max heap for the Gradle daemon JVM. Decompiling Minecraft (genSources) is
# memory-hungry. If you see OutOfMemoryError, raise this to -Xmx2G or more.
org.gradle.jvmargs=-Xmx1G

# Run independent tasks in parallel where possible.
org.gradle.parallel=true

# Cache the result of the configuration phase (evaluating build.gradle) between
# runs, for faster repeat builds. This is why build.gradle copies
# `project.version` / `project.name` into local variables: tasks may not touch
# `project` while executing under the configuration cache.
org.gradle.configuration-cache=true


# ------------------------------------------------------------------------------
#  Fabric Properties
#  check these on https://fabricmc.net/develop
# ------------------------------------------------------------------------------

# The Minecraft version to develop against. 26.x is the first unobfuscated
# line, so the code uses Mojang's official names directly.
# Mirrors "minecraft": "~26.1.2" in fabric.mod.json (~ = any 26.1.x >= 26.1.2).
minecraft_version=26.1.2

# Fabric Loader version used in dev runs and compiled against.
# Mirrors "fabricloader": ">=0.19.5" in fabric.mod.json.
loader_version=0.19.5

# Fabric Loom (Gradle plugin) version, used by `plugins { }` in build.gradle.
# "-SNAPSHOT" means "the latest 1.18 development build", so it can change
# between builds without this file changing.
loom_version=1.18-SNAPSHOT


# ------------------------------------------------------------------------------
#  Mod Properties
# ------------------------------------------------------------------------------

# The mod's version. Injected into fabric.mod.json's "version" field by the
# processResources task, and used in the jar file name.
version=1.0.0

# Maven group ID (only matters when publishing). By convention it matches the
# Java base package: com.vivek.minecraft.
group=com.vivek.minecraft


# ------------------------------------------------------------------------------
#  Dependencies
# ------------------------------------------------------------------------------

# Fabric API version. The "+26.1.2" suffix says which Minecraft version this
# build targets. It must match minecraft_version.
fabric_api_version=0.155.3+26.1.2


# ------------------------------------------------------------------------------
#  JDK selection: deliberately NOT configured here
# ------------------------------------------------------------------------------
#
# This file is committed and shared by every machine (Windows, macOS, CI), so
# it must never contain machine-specific values like JDK paths.
#
# - WHICH Java version Gradle runs on is pinned, platform-neutrally, in
#   gradle/gradle-daemon-jvm.properties (toolchainVersion=25). Gradle finds a
#   matching installed JDK by itself, whatever JAVA_HOME points at.
# - WHERE a JDK lives, if Gradle can't find it, goes in your per-machine
#   Gradle user file, outside the repo:
#       Windows:      %USERPROFILE%\.gradle\gradle.properties
#       macOS/Linux:  ~/.gradle/gradle.properties
#   Values there override this file. See README.md, "Per-machine settings".
